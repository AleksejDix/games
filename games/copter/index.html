<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cave Copter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- The shared site chrome: the topbar that keeps a game inside the app. -->
  <script type="module" src="../../shared/chrome.mjs"></script>

  <game-shell name="CAVE COPTER">
    <span slot="scores">Distance: <strong id="score">0</strong></span>
    <span slot="scores">Best: <strong id="best">0</strong></span>

    <canvas id="game" width="480" height="360"></canvas>

    <label slot="settings">tunnel
      <select id="tunnel">
        <option value="forgiving">forgiving</option>
        <option value="classic">classic</option>
        <option value="cruel">cruel</option>
      </select>
    </label>
    <label slot="settings"><input type="checkbox" id="sound" /> sound</label>

    <span slot="hint">hold Space or the screen to rise &middot; release to fall &middot; P pause &middot; Enter restart</span>
  </game-shell>

  <script type="module" src="../../shared/game-shell.mjs"></script>
  <script type="module" src="game.mjs"></script>
</body>
</html>
