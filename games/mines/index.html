<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Minesweeper</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- The shared site chrome: the topbar that keeps a game inside the app. -->
  <script type="module" src="../../shared/chrome.mjs"></script>

  <game-shell name="MINESWEEPER">
    <span slot="scores">Mines: <strong id="score">10</strong></span>

    <canvas id="game" width="480" height="480"></canvas>

    <label slot="settings">field
      <select id="size">
        <option value="9">9&times;9 &middot; 10</option>
        <option value="12">12&times;12 &middot; 24</option>
        <option value="16">16&times;16 &middot; 52</option>
      </select>
    </label>
    <label slot="settings"><input type="checkbox" id="sound" /> sound</label>

    <span slot="hint">click digs &middot; right-click or long-press flags &middot; the first dig is always safe &middot; Enter for a new field</span>
  </game-shell>

  <script type="module" src="../../shared/game-shell.mjs"></script>
  <script type="module" src="game.mjs"></script>
</body>
</html>
