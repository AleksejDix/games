<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lunar Lander</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- The shared site chrome: the topbar that keeps a game inside the app. -->
  <script type="module" src="../../shared/chrome.mjs"></script>

  <game-shell name="LANDER">
    <span slot="scores">Bonus: <strong id="score">0</strong></span>
    <span slot="scores">Best: <strong id="best">0</strong></span>

    <!-- 640×480 canvas pixels = the core's court units, mapped 1:1. -->
    <canvas id="game" width="640" height="480"></canvas>

    <label slot="settings">fuel
      <select id="fuel">
        <option value="250">tight</option>
        <option value="400">classic</option>
        <option value="600">generous</option>
      </select>
    </label>

    <span slot="hint">&larr;/&rarr; to tilt &middot; &uarr;/W to burn &middot; Space to pause &middot; Enter to restart</span>
  </game-shell>

  <script type="module" src="../../shared/game-shell.mjs"></script>
  <script type="module" src="game.mjs"></script>
</body>
</html>
