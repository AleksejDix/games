<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Memory</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- The shared site chrome: the topbar that keeps a game inside the app. -->
  <script type="module" src="../../shared/chrome.mjs"></script>

  <game-shell name="MEMORY">
    <span slot="scores">Tries: <strong id="score">0</strong></span>
    <span slot="scores">Best: <strong id="best">–</strong></span>

    <canvas id="game" width="480" height="480"></canvas>

    <label slot="settings">deck
      <select id="pairs">
        <option value="6">6 pairs</option>
        <option value="8">8 pairs</option>
        <option value="10">10 pairs</option>
      </select>
    </label>
    <label slot="settings"><input type="checkbox" id="sound" /> sound</label>

    <span slot="hint">tap cards to flip &middot; match every pair &middot; Enter for a new deal</span>
  </game-shell>

  <script type="module" src="../../shared/game-shell.mjs"></script>
  <script type="module" src="game.mjs"></script>
</body>
</html>
