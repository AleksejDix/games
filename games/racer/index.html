<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Racer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- The shared site chrome: the topbar that keeps a game inside the app. -->
  <script type="module" src="../../shared/chrome.mjs"></script>

  <game-shell name="RACER">
    <span slot="scores">Score: <strong id="score">0</strong></span>
    <span slot="scores">Best: <strong id="best">0</strong></span>

    <!-- 480×640 canvas pixels = the core's court units, mapped 1:1. -->
    <canvas id="game" width="480" height="640"></canvas>

    <label slot="settings">traffic
      <select id="traffic">
        <option value="light">light</option>
        <option value="normal">normal</option>
        <option value="rush">rush hour</option>
      </select>
    </label>

    <span slot="hint">&larr;/&rarr; to steer &middot; &uarr; gas &middot; &darr; brake &middot; Space to pause &middot; Enter to restart</span>
  </game-shell>

  <script type="module" src="../../shared/game-shell.mjs"></script>
  <script type="module" src="game.mjs"></script>
</body>
</html>
