<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Breakout</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- The shared site chrome: the topbar that keeps a game inside the app. -->
  <script type="module" src="../../shared/chrome.mjs"></script>

  <game-shell name="BREAKOUT">
    <span slot="scores">Score: <strong id="score">0</strong></span>
    <span slot="scores">Best: <strong id="best">0</strong></span>
    <span slot="scores" class="lives" id="lives"></span>

    <!-- 480×560 canvas pixels = the core's court units, mapped 1:1. -->
    <canvas id="game" width="480" height="560"></canvas>

    <label slot="settings">paddle
      <select id="paddle">
        <option value="wide">wide</option>
        <option value="classic">classic</option>
        <option value="narrow">narrow</option>
      </select>
    </label>
    <label slot="settings">lives
      <select id="startLives">
        <option value="1">1</option>
        <option value="3">3</option>
        <option value="5">5</option>
      </select>
    </label>

    <span slot="hint">&larr;/&rarr; or A/D to move &middot; Space to launch / pause &middot; Enter to restart</span>
  </game-shell>

  <script type="module" src="../../shared/game-shell.mjs"></script>
  <script type="module" src="game.mjs"></script>
</body>
</html>
