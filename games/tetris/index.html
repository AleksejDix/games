<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- The shared site chrome: the topbar that keeps a game inside the app. -->
  <script type="module" src="../../shared/chrome.mjs"></script>

  <game-shell name="TETRIS">
    <span slot="scores">Score: <strong id="score">0</strong></span>
    <span slot="scores">Best: <strong id="best">0</strong></span>

    <!-- 380×480: a 240px well of 24px cells plus the dossier panel. -->
    <canvas id="game" width="380" height="480"></canvas>

    <label slot="settings">start level
      <select id="startLevel">
        <option value="1">1 — patient</option>
        <option value="5">5 — brisk</option>
        <option value="9">9 — frantic</option>
      </select>
    </label>

    <span slot="hint">&larr;/&rarr; move &middot; &uarr; rotate &middot; &darr; soft drop &middot; Space hard drop &middot; P pause &middot; Enter restart</span>
  </game-shell>

  <script type="module" src="../../shared/game-shell.mjs"></script>
  <script type="module" src="game.mjs"></script>
</body>
</html>
