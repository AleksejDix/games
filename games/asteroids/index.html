<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Asteroids</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- The shared site chrome: the topbar that keeps a game inside the app. -->
  <script type="module" src="../../shared/chrome.mjs"></script>

  <game-shell name="ASTEROIDS">
    <span slot="scores">Score: <strong id="score">0</strong></span>
    <span slot="scores">Best: <strong id="best">0</strong></span>
    <span slot="scores" class="lives" id="lives"></span>

    <!-- 640×480 canvas pixels = the core's court units, mapped 1:1. -->
    <canvas id="game" width="640" height="480"></canvas>

    <label slot="settings">lives
      <select id="startLives">
        <option value="1">1</option>
        <option value="3">3</option>
        <option value="5">5</option>
      </select>
    </label>
    <label slot="settings">field
      <select id="field">
        <option value="3">sparse</option>
        <option value="4">classic</option>
        <option value="6">busy</option>
      </select>
    </label>

    <span slot="hint">&larr;/&rarr; turn &middot; &uarr; thrust &middot; Space to fire &middot; P to pause &middot; Enter to restart</span>
  </game-shell>

  <script type="module" src="../../shared/game-shell.mjs"></script>
  <script type="module" src="game.mjs"></script>
</body>
</html>
