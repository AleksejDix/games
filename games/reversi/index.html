<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reversi</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- The shared site chrome: the topbar that keeps a game inside the app. -->
  <script type="module" src="../../shared/chrome.mjs"></script>

  <game-shell name="REVERSI">
    <span slot="scores"><strong id="score"></strong></span>

    <canvas id="game" width="480" height="480"></canvas>

    <label slot="settings">opponent
      <select id="opponent">
        <option value="cpu">the machine</option>
        <option value="human">a friend</option>
      </select>
    </label>
    <label slot="settings"><input type="checkbox" id="sound" /> sound</label>

    <span slot="hint">click a glowing square &middot; flanked discs flip &middot; Enter for a rematch</span>
  </game-shell>

  <script type="module" src="../../shared/game-shell.mjs"></script>
  <script type="module" src="game.mjs"></script>
</body>
</html>
