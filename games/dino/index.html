<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chrome Dino</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- The shared site chrome: the topbar that keeps a game inside the app. -->
  <script type="module" src="../../shared/chrome.mjs"></script>

  <game-shell name="CHROME DINO">
    <span slot="scores">Score: <strong id="score">0</strong></span>
    <span slot="scores">Best: <strong id="best">0</strong></span>

    <!-- 600×338: the original’s width, an arcade-mode 16:9 sky. -->
    <canvas id="game" width="600" height="338"></canvas>

    <label slot="settings"><input type="checkbox" id="sound" /> sound</label>

    <span slot="hint">Space/&uarr; or tap to jump &middot; &darr; to duck &middot; P to pause &middot; Enter to restart</span>
  </game-shell>

  <script type="module" src="../../shared/game-shell.mjs"></script>
  <script type="module" src="game.mjs"></script>
</body>
</html>
