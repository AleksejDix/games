<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Snake</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- The shared site chrome: the topbar that keeps a game inside the app. -->
  <script type="module" src="../../shared/chrome.mjs"></script>

  <!-- The shared frame lives in <game-shell>'s shadow DOM; this page
       provides only its own parts as slotted children. Slotted nodes stay
       in the LIGHT DOM, so the engine's getElementById still finds every
       id below. -->
  <game-shell name="SNAKE">
    <span slot="scores">Score: <strong id="score">0</strong></span>
    <span slot="scores">Best: <strong id="best">0</strong></span>

    <!-- 420×420 canvas pixels = the core's court units, mapped 1:1. -->
    <canvas id="game" width="420" height="420"></canvas>

    <label slot="settings"><input type="checkbox" id="wrap" /> wrap-around walls</label>
    <label slot="settings">speed
      <select id="speed">
        <option value="170">chill</option>
        <option value="130">classic</option>
        <option value="95">fast</option>
      </select>
    </label>
    <label slot="settings"><input type="checkbox" id="sound" /> sound</label>

    <span slot="hint">Arrow keys / WASD to move &middot; Space to pause &middot; Enter to restart</span>
  </game-shell>

  <script type="module" src="../../shared/game-shell.mjs"></script>
  <script type="module" src="game.mjs"></script>
</body>
</html>
