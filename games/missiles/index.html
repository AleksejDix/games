<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Missile Command</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <header>
      <h1>MISSILE COMMAND</h1>
      <div class="scores">
        <span>Score: <strong id="score">0</strong></span>
        <span>Best: <strong id="best">0</strong></span>
        <span class="lives" id="lives"></span>
      </div>
    </header>

    <!-- 640×480 canvas pixels = the core's sky units, mapped 1:1. -->
    <canvas id="game" width="640" height="480"></canvas>

    <details class="settings">
      <summary>settings</summary>
      <div class="options">
        <label>ammo
          <select id="ammo">
            <option value="8">scarce</option>
            <option value="10">classic</option>
            <option value="14">generous</option>
          </select>
        </label>
        <label><input type="checkbox" id="sound" /> sound</label>
      </div>
    </details>

    <p class="hint">mouse to aim &middot; click to fire &middot; Space to pause &middot; Enter to restart</p>
  </main>

  <!-- The shared site chrome: the topbar that keeps a game inside the app. -->
  <script type="module" src="../../shared/chrome.mjs"></script>
  <script type="module" src="game.mjs"></script>
</body>
</html>
