<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Missile Command</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- The shared site chrome: the topbar that keeps a game inside the app. -->
  <script type="module" src="../../shared/chrome.mjs"></script>

  <!-- The shared frame lives in <game-shell>'s shadow DOM; this page
       provides only its own parts as slotted children. Slotted nodes stay
       in the LIGHT DOM, so the engine's getElementById still finds every
       id below. -->
  <game-shell name="MISSILE COMMAND">
    <span slot="scores">Score: <strong id="score">0</strong></span>
    <span slot="scores">Best: <strong id="best">0</strong></span>
    <span slot="scores" class="lives" id="lives"></span>

    <!-- 640×480 canvas pixels = the core's court units, mapped 1:1. -->
    <canvas id="game" width="640" height="480"></canvas>

    <label slot="settings">ammo
      <select id="ammo">
        <option value="8">scarce</option>
        <option value="10">classic</option>
        <option value="14">generous</option>
      </select>
    </label>
    <label slot="settings"><input type="checkbox" id="sound" /> sound</label>

    <span slot="hint">mouse to aim &middot; click to fire &middot; Space to pause &middot; Enter to restart</span>
  </game-shell>

  <script type="module" src="../../shared/game-shell.mjs"></script>
  <script type="module" src="game.mjs"></script>
</body>
</html>
