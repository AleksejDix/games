<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fifteen</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- The shared site chrome: the topbar that keeps a game inside the app. -->
  <script type="module" src="../../shared/chrome.mjs"></script>

  <game-shell name="FIFTEEN">
    <span slot="scores">Moves: <strong id="score">0</strong></span>
    <span slot="scores">Best: <strong id="best">–</strong></span>

    <!-- 480×480 canvas pixels; the board divides it by its size. -->
    <canvas id="game" width="480" height="480"></canvas>

    <label slot="settings">board
      <select id="boardSize">
        <option value="3">3×3</option>
        <option value="4">4×4</option>
        <option value="5">5×5</option>
      </select>
    </label>
    <label slot="settings"><input type="checkbox" id="sound" /> sound</label>

    <span slot="hint">click or tap a tile &middot; arrows slide &middot; Enter to shuffle again</span>
  </game-shell>

  <script type="module" src="../../shared/game-shell.mjs"></script>
  <script type="module" src="game.mjs"></script>
</body>
</html>
