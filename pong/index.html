<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pong</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <header>
      <h1>PONG</h1>
      <span class="vs">you vs. cpu &middot; first to 11</span>
    </header>

    <!-- 800×500 canvas pixels = the core's court units, mapped 1:1. -->
    <canvas id="game" width="800" height="500"></canvas>

    <p class="hint">W/S or &uarr;/&darr; to move &middot; Space to pause &middot; Enter to restart</p>
  </main>

  <script type="module" src="game.mjs"></script>
</body>
</html>
