<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NEON GAMES</title>
  <link rel="stylesheet" href="/shell.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <!-- Nav lists are rendered from the manifest by catalog.mjs. -->
      <nav class="nav" id="genreNav"></nav>
      <nav class="nav" id="inputNav"></nav>
      <nav class="nav" id="modeNav"></nav>
      <nav class="nav" id="yearNav"></nav>
      <p class="tagline">classics, rebuilt from scratch to learn game development</p>
    </aside>

    <!-- The filter FORM: a GET form is a URL description, and the router
         serializes it natively. It has no children — the search field and
         the sidebar radios associate from afar via form="filters", an
         underused HTML feature made for exactly this layout. data-replace:
         live filtering updates the address without spamming history. -->
    <form id="filters" action="/" data-link data-replace hidden></form>

    <header class="topbar">
      <a class="brandmark" href="/" id="brandHome" data-link></a>
      <!-- The user slot doubles as the door to your records. -->
      <a class="user" href="/records" data-link title="your records">
        <span class="avatar">☺</span>
        <span>guest</span>
      </a>
    </header>

    <main class="content">
      <!-- Every view starts hidden — the router's enter() reveals one. -->
      <section id="library" hidden>
        <!-- The toolbar: search and sort, both members of the filter form,
             both serialized into the URL like every other control. -->
        <div class="toolbar">
          <input id="search" type="search" placeholder="search games…" name="q" form="filters" />
          <select id="sort" name="sort" form="filters">
            <option value="">shelf order</option>
            <option value="name">a &ndash; z</option>
            <option value="oldest">oldest first</option>
            <option value="newest">newest first</option>
          </select>
        </div>
        <p class="count" id="count"></p>
        <ul class="catalog" id="catalog"></ul>
      </section>

      <!-- Your records: every best the games have persisted, read back
           from the same storage they write. Rendered fresh on enter(). -->
      <section id="records" hidden>
        <h2 class="records-title">your records</h2>
        <ul class="records" id="recordsList"></ul>
      </section>

      <!-- The player: games open HERE, in an iframe, inside the shell. -->
      <section id="player" hidden>
        <!-- The YouTube shape: the game holds the top-left slot always,
             its description card sits under it, and the sidebar carries
             the live parts. -->
        <div class="playerlayout">
          <div class="playerstage">
            <iframe id="playerFrame" title="game" allowfullscreen></iframe>
            <div class="gamedesc">
              <h2 class="paneltitle" id="panelTitle"></h2>
              <p id="panelAbout"></p>
              <h3>how to play</h3>
              <p id="panelHow"></p>
            </div>
          </div>
          <!-- The dossier: the game's LIVE nodes — scores the engine keeps
               writing to, settings with their listeners — adopted across
               the same-origin frame boundary. One source of truth,
               materialized where the player is. -->
          <aside class="gamepanel">
            <div class="playerscores" id="playerScores"></div>
            <h3>more games</h3>
            <!-- The related rail, YouTube-style: same genre first, then
                 the rest of the shelf. Rendered from tpl-more. -->
            <ul class="morelist" id="moreGames"></ul>
          </aside>
        </div>
      </section>
    </main>
  </div>

  <!-- ------------------------------------------------------------------
       HTML5 templates: the repeated markup lives HERE, in HTML, where
       markup belongs. catalog.mjs clones these and fills them with
       textContent — parsed once, no strings, no injection.
       ------------------------------------------------------------------ -->
  <template id="tpl-card">
    <li>
      <a class="card" href="/" data-link>
        <canvas class="thumb" width="320" height="200"></canvas>
        <h2></h2>
        <p></p>
        <span class="meta"><span class="year"></span><span class="tag genre"></span><span class="inputs"></span><span class="tag best" hidden></span></span>
      </a>
    </li>
  </template>

  <template id="tpl-card-soon">
    <li>
      <span class="card soon">
        <div class="thumb placeholder">?</div>
        <h2></h2>
        <p></p>
        <span class="meta"><span class="year"></span><span class="tag genre"></span></span>
      </span>
    </li>
  </template>

  <template id="tpl-nav-item">
    <!-- A radio input: the NATIVE single-select. Checked state drives the
         active styling via CSS :has(:checked) — no JS classes. -->
    <label class="nav-item">
      <input type="radio" form="filters" />
      <span class="label"></span><span class="n"></span>
    </label>
  </template>

  <template id="tpl-more">
    <li>
      <a class="more" href="/" data-link>
        <canvas width="104" height="64"></canvas>
        <span class="moretext">
          <span class="moretitle"></span>
          <span class="moremeta"></span>
        </span>
      </a>
    </li>
  </template>

  <template id="tpl-empty">
    <li class="empty">nothing matches — try fewer filters</li>
  </template>

  <template id="tpl-record">
    <li>
      <a class="record" data-link>
        <span class="rname"></span>
        <span class="rvalues"></span>
      </a>
    </li>
  </template>

  <!-- Absolute src: this page is also served for /play/:id deep links,
       where a relative "catalog.mjs" would resolve into /play/. -->
  <script type="module" src="/catalog.mjs"></script>
</body>
</html>
