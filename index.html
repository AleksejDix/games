<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NEON GAMES</title>
  <link rel="stylesheet" href="/shell.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <!-- Nav lists are rendered from the manifest by catalog.mjs. -->
      <nav class="nav" id="genreNav"></nav>
      <nav class="nav" id="inputNav"></nav>
      <nav class="nav" id="yearNav"></nav>
      <p class="tagline">classics, rebuilt from scratch to learn game development</p>
    </aside>

    <!-- The filter FORM: a GET form is a URL description, and the router
         serializes it natively. It has no children — the search field and
         the sidebar radios associate from afar via form="filters", an
         underused HTML feature made for exactly this layout. data-replace:
         live filtering updates the address without spamming history. -->
    <form id="filters" action="/" data-link data-replace hidden></form>

    <header class="topbar">
      <a class="brandmark" href="/" id="brandHome" data-link></a>
      <input id="search" type="search" placeholder="search games…" name="q" form="filters" />
      <div class="user">
        <span class="avatar">☺</span>
        <span>guest</span>
      </div>
    </header>

    <main class="content">
      <!-- Every view starts hidden — the router's enter() reveals one. -->
      <section id="library" hidden>
        <p class="count" id="count"></p>
        <ul class="catalog" id="catalog"></ul>
      </section>

      <!-- The player: games open HERE, in an iframe, inside the shell. -->
      <section id="player" hidden>
        <div class="playerbar">
          <a class="closer" href="/" data-link>&#9666; library</a>
          <span class="here" id="playerTitle"></span>
        </div>
        <iframe id="playerFrame" title="game"></iframe>
      </section>
    </main>
  </div>

  <!-- ------------------------------------------------------------------
       HTML5 templates: the repeated markup lives HERE, in HTML, where
       markup belongs. catalog.mjs clones these and fills them with
       textContent — parsed once, no strings, no injection.
       ------------------------------------------------------------------ -->
  <template id="tpl-card">
    <li>
      <a class="card" href="/" data-link>
        <canvas class="thumb" width="320" height="200"></canvas>
        <h2></h2>
        <p></p>
        <span class="meta"><span class="year"></span><span class="tag genre"></span><span class="inputs"></span></span>
      </a>
    </li>
  </template>

  <template id="tpl-card-soon">
    <li>
      <span class="card soon">
        <div class="thumb placeholder">?</div>
        <h2></h2>
        <p></p>
        <span class="meta"><span class="year"></span><span class="tag genre"></span></span>
      </span>
    </li>
  </template>

  <template id="tpl-nav-item">
    <!-- A radio input: the NATIVE single-select. Checked state drives the
         active styling via CSS :has(:checked) — no JS classes. -->
    <label class="nav-item">
      <input type="radio" form="filters" />
      <span class="label"></span><span class="n"></span>
    </label>
  </template>

  <template id="tpl-empty">
    <li class="empty">nothing matches — try fewer filters</li>
  </template>

  <script type="module" src="catalog.mjs"></script>
</body>
</html>
