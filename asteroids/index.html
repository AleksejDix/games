<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Asteroids</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <header>
      <h1>ASTEROIDS</h1>
      <div class="scores">
        <span>Score: <strong id="score">0</strong></span>
        <span>Best: <strong id="best">0</strong></span>
        <span class="lives" id="lives"></span>
      </div>
    </header>

    <!-- 640×480 canvas pixels = the core's space units, mapped 1:1. -->
    <canvas id="game" width="640" height="480"></canvas>

    <details class="settings">
      <summary>settings</summary>
      <div class="options">
        <label>lives
          <select id="startLives">
            <option value="1">1</option>
            <option value="3">3</option>
            <option value="5">5</option>
          </select>
        </label>
        <label>field
          <select id="field">
            <option value="3">sparse</option>
            <option value="4">classic</option>
            <option value="6">busy</option>
          </select>
        </label>
        <label><input type="checkbox" id="sound" /> sound</label>
      </div>
    </details>

    <p class="hint">&larr;/&rarr; turn &middot; &uarr; thrust &middot; Space to fire &middot; P to pause &middot; Enter to restart</p>
  </main>

  <script type="module" src="game.mjs"></script>
</body>
</html>
